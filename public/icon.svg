<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#3B1A6E" stop-opacity="0.72" />
      <stop offset="55%" stop-color="#140B29" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090712" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="55%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#090712" />
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <rect
    x="30"
    y="30"
    width="452"
    height="452"
    rx="92"
    fill="none"
    stroke="url(#neonBorder)"
    stroke-width="8"
    filter="url(#purpleGlow)"
  />

  <!-- Graduation cap emblem -->
  <g transform="translate(256, 168)" filter="url(#purpleGlow)">
    <polygon points="0,-42 66,-12 0,18 -66,-12" fill="url(#capGrad)" />
    <path d="M-38,2 L-38,26 C-38,38 -18,46 0,46 C18,46 38,38 38,26 L38,2 L0,20 Z" fill="url(#capGrad)" opacity="0.92" />
    <line x1="56" y1="-8" x2="56" y2="28" stroke="#E9D5FF" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="56" cy="32" r="6" fill="#C084FC" />
  </g>

  <!-- Crisp Arabic Title -->
  <text
    x="256"
    y="272"
    text-anchor="middle"
    fill="#E9D5FF"
    font-family="'Cairo', 'Tajawal', 'Noto Sans Arabic', sans-serif"
    font-size="40"
    font-weight="700"
    direction="rtl"
  >الأستاذة</text>

  <text
    x="256"
    y="346"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Cairo', 'Tajawal', 'Noto Sans Arabic', sans-serif"
    font-size="60"
    font-weight="900"
    direction="rtl"
  >تبارك الزيرجاوي</text>
</svg>
